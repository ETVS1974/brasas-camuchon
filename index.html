
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Brasas Camuchón</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Playfair+Display:ital,wght@0,700;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { min-height: 100vh; width: 100%; overflow-x: hidden; background: #080503; display: flex; justify-content: center; align-items: center; }
  .flyer { width: 100%; max-width: 1080px; min-height: 100vh; position: relative; background: #080503; overflow: hidden; padding-bottom: 40px; }
  .bg { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 45%, #3a1503 0%, #180801 50%, #040201 100%); }
  .deco-lines { position: absolute; inset: 0; background: repeating-linear-gradient(-45deg, transparent, transparent 70px, rgba(255,90,0,0.018) 70px, rgba(255,90,0,0.018) 71px); }
  .top-bar, .bottom-bar { position: absolute; left: 0; right: 0; height: 7px; background: linear-gradient(90deg, #c23200, #ff7700, #ff4500, #ff7700, #c23200); }
  .top-bar { top: 0; } .bottom-bar { bottom: 0; }
  .left-line, .right-line { position: absolute; top: 65px; bottom: 65px; width: 2px; background: linear-gradient(180deg, transparent, rgba(255,100,0,0.45), transparent); }
  .left-line { left: 50px; } .right-line { right: 50px; }
  .corner-glow { position: absolute; width: 350px; height: 350px; border-radius: 50%; pointer-events: none; }
  .corner-glow.tl { top:-120px; left:-120px; background: radial-gradient(circle, rgba(255,70,0,0.12) 0%, transparent 70%); }
  .corner-glow.br { bottom:-120px; right:-120px; background: radial-gradient(circle, rgba(255,70,0,0.09) 0%, transparent 70%); }
  .embers { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
  .ember { position: absolute; border-radius: 50%; animation: rise linear infinite; opacity: 0; }
  @keyframes rise {
    0%   { transform: translateY(0) translateX(0) scale(1); opacity: 0; }
    8%   { opacity: 0.9; } 92% { opacity: 0.4; }
    100% { transform: translateY(-1100px) translateX(var(--dx)) scale(0.2); opacity: 0; }
  }
  .content { position: relative; display: flex; flex-direction: column; align-items: center; padding: 30px 90px 80px; gap: 0; }
  .tag-top { font-family: 'Lato', sans-serif; font-weight: 300; font-size: 13px; letter-spacing: 9px; color: #ff8800; text-transform: uppercase; margin-bottom: 12px; margin-top: 18px; }
  .divider { display: flex; align-items: center; gap: 14px; width: 100%; margin-bottom: 14px; }
  .div-line { flex: 1; height: 1px; background: linear-gradient(90deg, transparent, rgba(255,120,0,0.55), transparent); }
  .div-dia { width: 7px; height: 7px; background: #ff6600; transform: rotate(45deg); flex-shrink: 0; }

  /* LOGO BLOCK - todo centrado como bloque */
  .logo-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 14px;
  }

  /* Fila conejo + BRASAS: desplazada a la izquierda para compensar el conejo */
  .logo-row {
    display: flex;
    align-items: center;
    justify-content: center;
    /* El conejo (185px) está a la izquierda de BRASAS.
       CAMUCHÓN tiene letter-spacing grande y es más ancho.
       Desplazamos la fila a la izquierda ~55px para que el centro
       visual de "conejo+BRASAS" quede alineado con CAMUCHÓN */
    margin-left: -90px;
  }

  .rabbit-wrap {
    position: relative; width: 185px; height: 185px; flex-shrink: 0;
    filter: drop-shadow(0 0 25px rgba(255,130,0,0.7)) drop-shadow(0 6px 18px rgba(0,0,0,0.85));
    margin-right: -8px; z-index: 2;
  }
  .rabbit-wrap img { width: 100%; height: 100%; object-fit: contain; }

  .brand-brasas {
    font-family: 'Bebas Neue', sans-serif; font-size: 148px; line-height: 1;
    color: #fff; letter-spacing: 5px;
    text-shadow: 0 0 55px rgba(255,100,0,0.85), 0 0 110px rgba(255,60,0,0.45), 3px 3px 18px rgba(0,0,0,0.95);
  }

  .brand-camuchon {
    font-family: 'Bebas Neue', sans-serif; font-size: 118px; line-height: 0.95;
    color: #ff5200; letter-spacing: 8px; text-align: center;
    text-shadow: 0 0 40px rgba(255,80,0,1), 0 0 80px rgba(255,40,0,0.7), 3px 3px 18px rgba(0,0,0,0.95);
    margin-top: -6px;
  }

  .methods { display: flex; align-items: center; gap: 16px; margin-bottom: 16px; margin-top: 14px; }
  .method { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .method-ico { font-size: 24px; filter: drop-shadow(0 0 6px rgba(255,130,0,0.9)); }
  .method-lbl { font-family: 'Lato', sans-serif; font-weight: 700; font-size: 9px; letter-spacing: 3px; color: #ff8c00; text-transform: uppercase; }
  .dot { width: 4px; height: 4px; background: #ff5500; border-radius: 50%; align-self: center; flex-shrink: 0; }

  .plates-label { font-family: 'Lato', sans-serif; font-weight: 300; font-size: 11px; letter-spacing: 7px; color: rgba(255,140,0,0.7); text-transform: uppercase; margin-bottom: 10px; }
  .plates-row { display: flex; align-items: stretch; justify-content: center; gap: 14px; width: 100%; margin-bottom: 16px; }
  .plate-card { flex: 1; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,100,0,0.25); border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 14px 10px 12px; position: relative; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,150,0,0.1); }
  .plate-card::before { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(255,80,0,0.05) 0%, transparent 60%); border-radius: 14px; }
  .plate-emoji { font-size: 52px; filter: drop-shadow(0 4px 12px rgba(255,100,0,0.7)); margin-bottom: 8px; line-height: 1; }
  .plate-fire { font-size: 18px; margin-bottom: 4px; }
  .plate-name { font-family: 'Bebas Neue', sans-serif; font-size: 22px; color: #fff; letter-spacing: 3px; text-shadow: 0 0 15px rgba(255,100,0,0.6); }
  .plate-sub { font-family: 'Lato', sans-serif; font-weight: 300; font-size: 9px; letter-spacing: 2px; color: rgba(255,140,0,0.6); text-transform: uppercase; margin-top: 2px; }

  .cta { background: linear-gradient(135deg, #e83d00 0%, #b82c00 100%); border-radius: 60px; padding: 14px 46px; display: flex; align-items: center; gap: 14px; box-shadow: 0 0 38px rgba(255,60,0,0.5), 0 6px 28px rgba(0,0,0,0.65); position: relative; overflow: hidden; }
  .cta::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 48%; background: rgba(255,255,255,0.07); border-radius: 60px 60px 0 0; }
  .cta-ico { font-size: 30px; }
  .cta-inner { display: flex; flex-direction: column; }
  .cta-lbl { font-family: 'Lato', sans-serif; font-weight: 300; font-size: 10px; letter-spacing: 4px; color: rgba(255,255,255,0.82); text-transform: uppercase; }
  .cta-num { font-family: 'Bebas Neue', sans-serif; font-size: 32px; color: #fff; letter-spacing: 3px; line-height: 1; text-shadow: 0 2px 8px rgba(0,0,0,0.5); }

  .footer { position: absolute; bottom: 20px; left: 0; right: 0; text-align: center; font-family: 'Lato', sans-serif; font-weight: 300; font-size: 10px; letter-spacing: 5px; color: rgba(255,140,0,0.38); text-transform: uppercase; }
</style>
</head>
