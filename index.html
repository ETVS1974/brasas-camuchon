<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Brasas Camuchón</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Playfair+Display:ital,wght@0,700;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px; height: 1080px;
    overflow: hidden;
    background: #080503;
  }
  .flyer {
    width: 1080px; height: 1080px;
    position: relative;
    background: #080503;
    overflow: hidden;
  }
  .bg {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at 50% 65%, #3a1503 0%, #180801 45%, #040201 100%);
  }
  .deco-lines {
    position: absolute; inset: 0;
    background: repeating-linear-gradient(-45deg, transparent, transparent 70px, rgba(255,90,0,0.02) 70px, rgba(255,90,0,0.02) 71px);
  }
  .top-bar, .bottom-bar {
    position: absolute; left: 0; right: 0; height: 7px;
    background: linear-gradient(90deg, #c23200, #ff7700, #ff4500, #ff7700, #c23200);
  }
  .top-bar { top: 0; }
  .bottom-bar { bottom: 0; }
  .left-line, .right-line {
    position: absolute; top: 70px; bottom: 70px; width: 2px;
    background: linear-gradient(180deg, transparent, rgba(255,100,0,0.5), transparent);
  }
  .left-line { left: 52px; }
  .right-line { right: 52px; }
  .corner-glow {
    position: absolute; width: 350px; height: 350px; border-radius: 50%; pointer-events: none;
  }
  .corner-glow.tl { top:-120px; left:-120px; background: radial-gradient(circle, rgba(255,70,0,0.13) 0%, transparent 70%); }
  .corner-glow.br { bottom:-120px; right:-120px; background: radial-gradient(circle, rgba(255,70,0,0.10) 0%, transparent 70%); }
  .embers { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
  .ember {
    position: absolute; border-radius: 50%;
    animation: rise linear infinite; opacity: 0;
  }
  @keyframes rise {
    0%   { transform: translateY(0) translateX(0) scale(1); opacity: 0; }
    8%   { opacity: 0.9; }
    92%  { opacity: 0.4; }
    100% { transform: translateY(-1000px) translateX(var(--dx)) scale(0.2); opacity: 0; }
  }

  .content {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 55px 95px; gap: 0;
  }

  .tag-top {
    font-family: 'Lato', sans-serif; font-weight: 300;
    font-size: 14px; letter-spacing: 9px;
    color: #ff8800; text-transform: uppercase;
    margin-bottom: 16px;
  }

  .divider {
    display: flex; align-items: center; gap: 14px;
    width: 100%; margin-bottom: 20px;
  }
  .div-line { flex: 1; height: 1px; background: linear-gradient(90deg, transparent, rgba(255,120,0,0.6), transparent); }
  .div-dia { width: 7px; height: 7px; background: #ff6600; transform: rotate(45deg); flex-shrink: 0; }

  .brand {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 128px; line-height: 0.88;
    color: #fff; text-align: center;
    letter-spacing: 5px;
    text-shadow: 0 0 50px rgba(255,100,0,0.9), 0 0 100px rgba(255,60,0,0.5), 3px 3px 18px rgba(0,0,0,0.95);
    margin-bottom: 6px;
  }
  .brand .accent { color: #ff5200; text-shadow: 0 0 35px rgba(255,80,0,1), 0 0 70px rgba(255,40,0,0.8), 3px 3px 18px rgba(0,0,0,0.95); }

  .rabbit-wrap {
    position: relative;
    width: 230px; height: 230px;
    margin: 8px 0 4px;
    filter: drop-shadow(0 0 28px rgba(255,110,0,0.55)) drop-shadow(0 8px 20px rgba(0,0,0,0.8));
  }
  .rabbit-wrap img {
    width: 100%; height: 100%;
    object-fit: contain;
  }
  .rabbit-glow {
    position: absolute; bottom: -18px; left: 50%;
    transform: translateX(-50%);
    width: 180px; height: 28px;
    background: radial-gradient(ellipse, rgba(255,100,0,0.55) 0%, transparent 70%);
    border-radius: 50%;
  }

  .methods {
    display: flex; align-items: center; gap: 18px;
    margin: 14px 0 18px;
  }
  .method { display: flex; flex-direction: column; align-items: center; gap: 5px; }
  .method-ico { font-size: 30px; filter: drop-shadow(0 0 8px rgba(255,130,0,0.9)); }
  .method-lbl {
    font-family: 'Lato', sans-serif; font-weight: 700;
    font-size: 10px; letter-spacing: 3px;
    color: #ff8c00; text-transform: uppercase;
  }
  .dot { width: 5px; height: 5px; background: #ff5500; border-radius: 50%; align-self: center; flex-shrink: 0; }

  .slogan {
    font-family: 'Playfair Display', serif;
    font-size: 20px; font-style: italic;
    color: rgba(255,255,255,0.72);
    text-align: center; line-height: 1.55;
    margin-bottom: 22px;
  }
  .slogan strong { color: #ff8c00; font-style: normal; }

  .fire-div {
    display: flex; align-items: center; gap: 12px;
    width: 80%; margin-bottom: 22px;
  }
  .fire-line { flex: 1; height: 1px; background: linear-gradient(90deg, transparent, rgba(255,100,0,0.45), transparent); }

  .cta {
    background: linear-gradient(135deg, #e83d00 0%, #b82c00 100%);
    border-radius: 60px; padding: 16px 50px;
    display: flex; align-items: center; gap: 16px;
    box-shadow: 0 0 40px rgba(255,60,0,0.55), 0 8px 30px rgba(0,0,0,0.65);
    position: relative; overflow: hidden;
  }
  .cta::before {
    content: ''; position: absolute;
    top: 0; left: 0; right: 0; height: 48%;
    background: rgba(255,255,255,0.07);
    border-radius: 60px 60px 0 0;
  }
  .cta-ico { font-size: 32px; }
  .cta-inner { display: flex; flex-direction: column; }
  .cta-lbl {
    font-family: 'Lato', sans-serif; font-weight: 300;
    font-size: 11px; letter-spacing: 4px;
    color: rgba(255,255,255,0.82); text-transform: uppercase;
  }
  .cta-num {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 34px; color: #fff;
    letter-spacing: 3px; line-height: 1;
    text-shadow: 0 2px 8px rgba(0,0,0,0.5);
  }

  .footer {
    position: absolute; bottom: 22px;
    left: 0; right: 0; text-align: center;
    font-family: 'Lato', sans-serif; font-weight: 300;
    font-size: 10px; letter-spacing: 5px;
    color: rgba(255,140,0,0.4); text-transform: uppercase;
  }
</style>
</head>

<script>
  const container = document.getElementById('embers');
  const colors = ['#ff4500','#ff6600','#ff8800','#ffaa00','#ff3300'];
  for (let i = 0; i < 40; i++) {
    const e = document.createElement('div');
    e.className = 'ember';
    const size = Math.random() * 5 + 2;
    e.style.cssText = `
      width:${size}px; height:${size}px;
      left:${Math.random()*1080}px; bottom:0;
      background:${colors[Math.floor(Math.random()*5)]};
      box-shadow: 0 0 ${size*2}px ${colors[Math.floor(Math.random()*5)]};
      animation-duration:${Math.random()*7+5}s;
      animation-delay:${Math.random()*9}s;
      --dx:${(Math.random()-0.5)*200}px;
    `;
    container.appendChild(e);
  }
</script>
</body>
